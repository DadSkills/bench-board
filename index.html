<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bench Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
:root{
  /* layout: header with four tabs, one working view at a time; the rink fills whatever height is left */
  --bg:#e9eff6; --surface:#ffffff; --tint:#f2f6fa; --ink:#0f1b2d; --muted:#56667c; --line:#cfd9e6;
  --accent:#c8102e; --on-accent:#ffffff; --blue:#16408a; --good:#17804a; --warn:#b05e00;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b121c;--surface:#141e2c;--tint:#1a2638;--ink:#e9eef6;--muted:#94a4ba;--line:#2a3a50;--accent:#e23a50;--on-accent:#ffffff;--blue:#8db2f5;--good:#4fc98a;--warn:#f2aa4a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b121c;--surface:#141e2c;--tint:#1a2638;--ink:#e9eef6;--muted:#94a4ba;--line:#2a3a50;--accent:#e23a50;--on-accent:#ffffff;--blue:#8db2f5;--good:#4fc98a;--warn:#f2aa4a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--body);-webkit-text-size-adjust:100%}
#root{height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px 4px;flex-wrap:wrap}
.brand{font:700 24px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-flex;gap:3px;height:18px}
.brand i b{width:4px;border-radius:1px;background:var(--blue)}
.brand i b:nth-child(2){background:var(--accent)}
.savebox{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(5,1fr);padding:0 6px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 2px 8px;font:600 17px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{flex:1 1 0;min-height:0;overflow:auto}
.view{padding:12px 16px 24px;max-width:860px;margin:0 auto}
#v-board{max-width:none;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:500;font-size:14px;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.quiet{background:transparent}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{min-height:38px;min-width:42px;padding:0 11px;border:0;border-right:1px solid var(--line);background:none;font-weight:600;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center}
.sw span{width:24px;height:24px;border-radius:50%;border:1px solid rgba(15,27,45,.35)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.field{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:15px;min-width:0}
.grow{flex:1 1 140px}
#v-board>.bar{flex:none;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:3px 22px;margin:-3px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 22px),transparent)}
#v-board>.bar::before,#v-board>.bar::after,.tray::before,.tray::after{content:"";flex:1 0 0}
#hint{text-align:center}
#v-board>.bar::-webkit-scrollbar{display:none}
#v-board>.bar>*{flex:none}
#v-board>.bar .bar{flex-wrap:nowrap}
#v-board>.bar .grow{flex:1 0 150px}
.tray{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tray button{flex:none;min-height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.tray button b{font:700 16px/1 var(--display);margin-right:4px}
.tray button.placed{color:var(--muted);border-style:dashed}
.tray button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.rinkwrap{position:relative;flex:1 1 0;min-height:340px}
#rink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;
  --rk-ice:#e4edf6;--rk-red:#e7929b;--rk-blue:#8fb0ea;--rk-board:#0f1b2d;--rk-crease:#c6dcf5}
#rink.dark{--rk-ice:#1b2838;--rk-red:#93404b;--rk-blue:#40639f;--rk-board:#7c8da3;--rk-crease:#233850}
#rink .ice{fill:var(--rk-ice)}
#rink .boards{fill:none;stroke:var(--rk-board);stroke-width:1.2}
#rink .rb{fill:var(--rk-blue)} #rink .rr{fill:var(--rk-red)}
#rink .rl{stroke:var(--rk-red);stroke-width:.35;fill:none}
#rink .rcr{stroke:var(--rk-red);stroke-width:.35;fill:none}
#rink .rcb{stroke:var(--rk-blue);stroke-width:.35;fill:none}
#rink .dr{fill:var(--rk-red)} #rink .db{fill:var(--rk-blue)}
#rink .crease{fill:var(--rk-crease);stroke:var(--rk-red);stroke-width:.35}
#rink .net{fill:none;stroke:var(--rk-red);stroke-width:.4}
.c-red{--c:#d0202e;--k:rgba(255,255,255,.55);--t:#fff}
.c-black{--c:#11151c;--k:rgba(255,255,255,.8);--t:#fff}
.c-blue{--c:#1553c7;--k:rgba(255,255,255,.55);--t:#fff}
.c-white{--c:#ffffff;--k:#0f1b2d;--t:#0f1b2d}
#rink .hit{fill:none;stroke:transparent;stroke-width:5;pointer-events:stroke}
#rink circle.hit{fill:transparent;stroke:none;pointer-events:fill}
#rink .case{fill:none;stroke:var(--k);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#rink .ln{fill:none;stroke:var(--c);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
#rink .mk .case{stroke-width:1.9} #rink .mk .ln{stroke-width:1.05}
#rink .head{fill:var(--c);stroke:var(--k);stroke-width:.35;stroke-linejoin:round}
#rink .chip{fill:var(--c);stroke:var(--k);stroke-width:.45}
#rink text{font:700 3.5px var(--display);fill:var(--t);pointer-events:none}
#rink .puck{fill:#11151c;stroke:#fff;stroke-width:.35}
h2{font:700 20px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:18px 0 8px;text-wrap:balance}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.note{background:var(--tint);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:12px}
.sum{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
.addrow,.prow{display:grid;grid-template-columns:54px minmax(0,1fr) 74px 40px;gap:6px;align-items:center}
.addrow{display:flex;flex-wrap:wrap}
.addrow .num{width:54px}.addrow #addName{flex:1 1 130px}
.prow{grid-template-columns:34px 48px minmax(0,1fr) 68px;padding-left:4px;padding-right:4px}
.prow.hl{background:color-mix(in srgb,var(--hl) 26%,var(--surface));box-shadow:inset 5px 0 0 var(--hl)}
.chk{display:grid;place-items:center;min-height:38px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.thead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 4px}
.tname{flex:1 1 140px;font:700 20px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.sw.sm{width:32px;height:32px}.sw.sm span{width:20px;height:20px}
.nohl{background:linear-gradient(135deg,transparent 44%,var(--accent) 44% 56%,transparent 56%)}
.act{position:sticky;bottom:8px;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-color:var(--ink);box-shadow:0 6px 20px rgba(8,14,24,.25)}
.hdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.prow{padding:5px 4px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.num{text-align:center;font:700 19px/1 var(--display);padding:0 4px}
.del{min-height:38px;border:0;background:none;border-radius:8px;color:var(--muted);font-size:13px;padding:0}
.del.armed{background:var(--warn);color:#fff;font-weight:600}
.lrow{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:stretch;padding:6px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lname{font:700 22px/1 var(--display);align-self:center}
.slots{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.slot{min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--tint);padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.slot small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.slot b{font:700 18px/1 var(--display)}
.slot span{font-size:13px;line-height:1.15}
.slot.empty{border-style:dashed;background:transparent;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(8,14,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:min(520px,100%);max-height:80%;border-radius:14px 14px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.sheet h3{font:700 19px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.sheet .list{overflow:auto;padding:6px 8px 14px}
.sheet .sub{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.pick{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;border:0;border-radius:8px;background:none;text-align:left;padding:4px 8px}
.pick:hover{background:var(--tint)}
.pick b{font:700 20px/1 var(--display);width:28px;text-align:center}
.pick em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--muted)}
.clock{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.clock .time{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums;min-width:110px}
.clock .state{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.clock .state.live{color:var(--good)}
.lbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.lbtn{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.lbtn b{font:700 22px/1 var(--display)}
.lbtn span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.lbtn[aria-pressed="true"] span{color:#fff}
.glabel{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.glabel:first-child{margin-top:0}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) 32px 46px 42px 50px;gap:4px;align-items:center;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);border-left:4px solid transparent;padding:0 6px 0 6px;min-height:44px;font-size:14px;font-variant-numeric:tabular-nums}
.srow.hd{min-height:26px;border-top:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.srow b{font:700 19px/1 var(--display)}
.srow .r{text-align:right}
.srow .nm small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.srow.on{border-left-color:var(--good);background:var(--tint)}
.srow.on .now{color:var(--good);font-weight:600}
.srow.long .now{color:var(--warn)}
.srow .now{color:var(--muted)}
.sgroup{font:700 15px/1 var(--display);letter-spacing:.08em;color:var(--muted);padding:10px 6px 4px;border-top:1px solid var(--line)}
.empty-msg{color:var(--muted);padding:8px 0}
#navToggle{display:none}
@media (orientation:landscape) and (max-height:540px){
  #root>header{position:fixed;top:0;left:0;right:0;z-index:6;transform:translateY(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s;box-shadow:0 6px 18px rgba(8,14,24,.25)}
  .nav-open #root>header{transform:none;visibility:visible}
  #navToggle{display:block;position:fixed;top:6px;right:8px;z-index:7;min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font:600 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
  .nav-open #navToggle{top:auto;bottom:8px}
  #v-board{padding-top:6px;gap:6px}
  #v-board>#toolbar{margin-left:84px;margin-right:84px}
  .view:not(#v-board){padding-top:52px}
  .rinkwrap{min-height:190px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#root>header{transition:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pbtn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;min-height:66px}
.pbtn b{font:700 22px/1 var(--display);grid-row:span 2}
.pbtn .who{font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.pbtn .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 8px}
.pbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pbtn[aria-pressed="true"] .st{color:#fff}
.srow.u{grid-template-columns:30px minmax(0,1fr) 50px 52px}
@media (max-width:420px){nav button{font-size:16px}.top{padding:8px 12px 2px}.brand{font-size:21px}.view{padding:12px 12px 24px}.btn{padding:0 10px}}

var LINE_DEF=[['F1',['LW','C','RW']],['F2',['LW','C','RW']],['F3',['LW','C','RW']],['F4',['LW','C','RW']],['D1',['LD','RD']],['D2',['LD','RD']],['D3',['LD','RD']],['G',['G1','G2']]];

  var raw=[[9,'Mats Lindqvist','C'],[17,'Tyler Brandt','LW'],[21,'Owen Kessler','RW'],[14,'Jonah Fitch','C'],[11,'Eli Sorensen','LW'],[28,'Marcus Doyle','RW'],[19,'Reid Halvorsen','C'],[22,'Caleb Moreau','LW'],[26,'Dane Whitlock','RW'],[12,'Noah Pruitt','C'],[15,'Finn Gallagher','LW'],[24,'Ari Toivonen','RW'],[4,'Brody Lachance','D'],[7,'Wes Okafor','D'],[5,'Soren Dahl','D'],[23,'Cole Tanaka','D'],[2,'Jesse Marlow','D'],[6,'Luca Ferreira','D'],[30,'Theo Brennan','G'],[35,'Sam Ostrowski','G']];

'<header><div class="top"><h1 class="brand"><i aria-hidden="true"><b></b><b></b><b></b></i>Bench Board</h1>'+

function show(v){

  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===v?'true':'false')});
  if(v==='board'){renderChrome();layoutRink()}
  if(v==='roster')renderRoster();
  if(v==='lines')renderLines();
  if(v==='shifts')renderShifts();
  if(v==='u9')renderU9();
}

var svg=$('#rink'),rg=$('#rg'),itemsG=$('#items'),liveG=$('#live'),wrap=$('#wrap');
var tool='x',color='red',dash=false,arrow=true,selPid=null,vertical=false;
var undo={};
(function drawRink(){
  var h='<defs><clipPath id="rc"><rect x="0" y="0" width="200" height="85" rx="28"/></clipPath></defs>'+
  '<rect class="ice" x="0" y="0" width="200" height="85" rx="28"/><g clip-path="url(#rc)">'+

  '<line class="rl" x1="11" y1="0" x2="11" y2="85"/><line class="rl" x1="189" y1="0" x2="189" y2="85"/>'+

  '<circle class="rcb" cx="100" cy="42.5" r="15"/><circle class="db" cx="100" cy="42.5" r=".8"/>';
  [31,169].forEach(function(x){[20.5,64.5].forEach(function(y){
    h+='<circle class="rcr" cx="'+x+'" cy="'+y+'" r="15"/><circle class="dr" cx="'+x+'" cy="'+y+'" r="1"/>';
    [-1,1].forEach(function(sx){[-1,1].forEach(function(sy){h+='<line class="rl" x1="'+(x+sx*2)+'" y1="'+(y+sy*14.9)+'" x2="'+(x+sx*2)+'" y2="'+(y+sy*17)+'"/>'})});
  })});
  [80,120].forEach(function(x){[20.5,64.5].forEach(function(y){h+='<circle class="dr" cx="'+x+'" cy="'+y+'" r="1"/>'})});
  h+='<rect class="net" x="7.7" y="39.5" width="3.3" height="6" rx="1"/><rect class="net" x="189" y="39.5" width="3.3" height="6" rx="1"/>'+
  '<rect class="boards" x="0" y="0" width="200" height="85" rx="28"/>';
  $('#marks').innerHTML=h;
})();
function layoutRink(){
  var w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;
  var hf=+state.half||0,L=hf?100:200,r=(state.rot||0)%4,off=!hf?-2:((hf===1)===(r<2)?-2:98);
  var vb=r%2===0?(off+' -2 '+(L+4)+' 89'):('-2 '+off+' 89 '+(L+4));
  var tf=['','translate(85 0) rotate(90)','translate(200 85) rotate(180)','translate(0 200) rotate(-90)'][r];
  svg.setAttribute('viewBox',vb);
  var q=vb.split(' '),vr=$('#vpr');vr.setAttribute('x',q[0]);vr.setAttribute('y',q[1]);vr.setAttribute('width',q[2]);vr.setAttribute('height',q[3]);
  if(tf)rg.setAttribute('transform',tf);else rg.removeAttribute('transform');
  svg.classList.toggle('dark',!!state.dark);
  renderItems();
}
function pathD(pts){return 'M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('L')}
function headSVG(pts){
  var n=pts.length,tip=pts[n-1],b=pts[n-2];
  for(var i=n-2;i>=0;i--){b=pts[i];if(Math.hypot(tip[0]-b[0],tip[1]-b[1])>=2.5)break}
  var a=Math.atan2(tip[1]-b[1],tip[0]-b[0]),c=Math.cos(a),s=Math.sin(a),len=3.4,hw=1.8;
  var tx=tip[0]+c*1.2,ty=tip[1]+s*1.2,bx=tx-c*len,by=ty-s*len;
  return '<polygon class="head" points="'+tx.toFixed(1)+','+ty.toFixed(1)+' '+(bx-s*hw).toFixed(1)+','+(by+c*hw).toFixed(1)+' '+(bx+s*hw).toFixed(1)+','+(by-c*hw).toFixed(1)+'"/>';
}
function itemSVG(it,i){
  var R=-90*((state.rot||0)%4),di=i==null?'':' data-i="'+i+'"';
  if(it.t==='s'){
    var d=pathD(it.pts),da=it.dash?' stroke-dasharray="2.2 2"':'';
    return '<g'+di+' class="stk c-'+it.c+'"><path class="hit" d="'+d+'"/><path class="case" d="'+d+'"'+da+'/><path class="ln" d="'+d+'"'+da+'/>'+(it.arrow&&it.pts.length>1?headSVG(it.pts):'')+'</g>';
  }
  var cc=it.c||'black',pp=it.t==='p'?P(it.pid):null;if(pp)cc=teamOf(pp).c;
  var g='<g'+di+' class="mk c-'+cc+'" transform="translate('+it.x.toFixed(1)+' '+it.y.toFixed(1)+')"><circle class="hit" r="4.2"/>';
  if(it.t==='x'){var x='M-2.2 -2.2L2.2 2.2M-2.2 2.2L2.2 -2.2';g+='<path class="case" d="'+x+'"/><path class="ln" d="'+x+'"/>'}
  else if(it.t==='o'){g+='<circle class="case" r="2.5"/><circle class="ln" r="2.5"/>'}
  else if(it.t==='puck'){g+='<circle class="puck" r="1.4"/>'}
  else if(it.t==='p'){var p=pp;if(p&&p.hl&&HL[p.hl])g+='<circle r="4.1" fill="none" stroke="'+HL[p.hl]+'" stroke-width="1"/>';g+='<circle class="chip" r="3.2"/><text transform="rotate('+R+')" text-anchor="middle" dy=".36em">'+esc(p?p.num:'?')+'</text>'}
  return g+'</g>';
}
function renderItems(){itemsG.innerHTML=cur().items.map(itemSVG).join('')}
function pt(e){
  var m=rg.getScreenCTM();if(!m)return null;
  var q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  return {x:Math.max(0,Math.min(200,q.x)),y:Math.max(0,Math.min(85,q.y))};
}
function onIce(e){
  var m=rg.getScreenCTM();if(!m)return false;
  var q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()),x=q.x,y=q.y;
  if(x<0||x>200||y<0||y>85)return false;
  var hf=+state.half||0;if((hf===1&&x>102)||(hf===2&&x<98))return false;
  var cx=x<28?28:x>172?172:x,cy=y<28?28:y>57?57:y;
  return Math.hypot(x-cx,y-cy)<=28;
}
function ustack(){var id=cur().id;return undo[id]||(undo[id]=[])}
function pushUndo(){var s=ustack();s.push(JSON.stringify(cur().items));if(s.length>60)s.shift()}
function commit(){renderItems();renderTray();save()}
var act=null;
function eraseAt(e){
  var el=document.elementFromPoint(e.clientX,e.clientY);el=el&&el.closest&&el.closest('#items [data-i]');
  if(!el)return;if(!act.did){pushUndo();act.did=true}
  cur().items.splice(+el.dataset.i,1);renderItems();
}
svg.addEventListener('pointerdown',function(e){
  if(e.button)return;var p=pt(e);if(!p)return;e.preventDefault();
  if(!onIce(e)&&!e.target.closest('#items [data-i]'))return;
  var items=cur().items,hitEl=e.target.closest('#items [data-i]'),hi=hitEl?+hitEl.dataset.i:-1;
  try{svg.setPointerCapture(e.pointerId)}catch(x){}
  if(tool==='erase'){act={k:'erase',did:false};eraseAt(e);return}
  if(tool==='draw'){act={k:'draw',it:{t:'s',c:color,dash:dash,arrow:arrow,pts:[[p.x,p.y]]}};return}
  if(hi>=0&&(tool==='move'||items[hi].t!=='s')){pushUndo();act={k:'drag',i:hi,last:p,moved:false};return}
  if(tool==='move')return;
  var it=null;
  if(tool==='x'||tool==='o')it={t:tool,x:p.x,y:p.y,c:color};
  else if(tool==='puck')it={t:'puck',x:p.x,y:p.y};
  else if(tool==='p'){
    if(!selPid||!P(selPid)){$('#hint').textContent=state.roster.length?'Pick a player from the strip above, then tap the ice.':'Add players in the Roster tab first.';return}
    it={t:'p',pid:selPid,x:p.x,y:p.y,c:color};
  }
  if(!it)return;
  pushUndo();
  if(it.t==='p'){for(var i=items.length-1;i>=0;i--)if(items[i].t==='p'&&items[i].pid===it.pid)items.splice(i,1)}
  items.push(it);
  if(it.t==='p'){var nx=state.roster.filter(function(r){return !items.some(function(q){return q.t==='p'&&q.pid===r.id})})[0];if(nx)selPid=nx.id}
  act={k:'drag',i:items.length-1,last:p,moved:true};
  commit();
});
svg.addEventListener('pointermove',function(e){
  if(!act)return;var p=pt(e);if(!p)return;
  if(act.k==='erase'){eraseAt(e);return}
  if(act.k==='draw'){
    var pts=act.it.pts,l=pts[pts.length-1];
    if(Math.hypot(p.x-l[0],p.y-l[1])<0.8)return;
    pts.push([p.x,p.y]);liveG.innerHTML=itemSVG(act.it,null);return;
  }
  if(act.k==='drag'){
    var it=cur().items[act.i];if(!it)return;var dx=p.x-act.last.x,dy=p.y-act.last.y;if(!dx&&!dy)return;
    if(it.t==='s')it.pts.forEach(function(q){q[0]+=dx;q[1]+=dy});else{it.x=p.x;it.y=p.y}
    act.last=p;act.moved=true;renderItems();
  }
});
function endAct(){
  if(!act)return;var a=act;act=null;liveG.innerHTML='';
  if(a.k==='draw'){
    if(a.it.pts.length<2)return;
    a.it.pts=a.it.pts.map(function(q){return [Math.round(q[0]*10)/10,Math.round(q[1]*10)/10]});
    pushUndo();cur().items.push(a.it);commit();return;
  }
  if(a.k==='drag'){if(!a.moved)ustack().pop();else{var it=cur().items[a.i];if(it&&it.t!=='s'){it.x=Math.round(it.x*10)/10;it.y=Math.round(it.y*10)/10}commit()}return}
  if(a.k==='erase'&&a.did)commit();
}
svg.addEventListener('pointerup',endAct);svg.addEventListener('pointercancel',endAct);
if(window.ResizeObserver)new ResizeObserver(function(){if(view==='board')layoutRink()}).observe(wrap);else window.addEventListener('resize',layoutRink);

var HINTS={x:'Tap the ice to place an X. Drag any marker to move it.',o:'Tap the ice to place an O. Drag any marker to move it.',p:'Pick a player below, then tap the ice. Numbers show in the team colour.',puck:'Tap the ice to place a puck.',draw:'Drag on the ice to draw. Solid for skating, dashed for a pass.',move:'Drag a marker or a line to move it.',erase:'Tap or swipe over a marker or line to remove it.'};
function renderTray(){
  var t=$('#tray');t.hidden=tool!=='p';if(t.hidden)return;
  if(!state.roster.length){t.innerHTML='<span class="hint">No players yet. Add them in the Roster tab.</span>';return}
  if(!selPid||!P(selPid))selPid=state.roster[0].id;
  var items=cur().items;
  t.innerHTML=state.roster.slice().sort(function(a,b){return (a.team?1:0)-(b.team?1:0)}).map(function(r){var placed=items.some(function(q){return q.t==='p'&&q.pid===r.id});
    return '<button data-pid="'+r.id+'" class="'+(placed?'placed':'')+'" aria-pressed="'+(r.id===selPid)+'"'+(r.hl&&HL[r.hl]?' style="box-shadow:inset 0 -4px 0 '+HL[r.hl]+'"':'')+'><i class="hdot" style="background:'+PEN[teamOf(r).c]+';border:1px solid var(--muted)"></i><b>'+esc(r.num||'–')+'</b>'+esc(last(r.name))+'</button>'}).join('');
}
function renderChrome(){
  var sel=$('#playSel');sel.innerHTML=state.plays.map(function(p){return '<option value="'+p.id+'"'+(p.id===state.cur?' selected':'')+'>'+esc(p.name)+'</option>'}).join('');
  document.querySelectorAll('#tools button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===tool)});
  document.querySelectorAll('#colors button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===color)});
  document.querySelectorAll('#lstyle button').forEach(function(b){b.setAttribute('aria-pressed',(b.dataset.d==='1')===dash)});
  $('#arrow').setAttribute('aria-pressed',arrow);document.querySelectorAll('#half button').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.h===(+state.half||0))});$('#dark').setAttribute('aria-pressed',!!state.dark);
  $('#lstyle').hidden=$('#arrow').hidden=tool!=='draw';
  $('#colors').hidden=tool==='puck'||tool==='move'||tool==='erase'||tool==='p';
  $('#playDel').disabled=state.plays.length<2;
  $('#hint').textContent=HINTS[tool];

  '<p class="sum">Tick players to highlight them, move them to the other team or remove them. <button class="btn quiet" id="sortNum" style="margin-left:6px">Sort by number</button></p>';
  [0,1].forEach(function(t){
    var tm=state.teams[t],list=r.filter(function(p){return (p.team?1:0)===t}),d=list.filter(function(p){return p.pos==='D'}).length,g=list.filter(function(p){return p.pos==='G'}).length;
    h+='<div class="thead"><input class="field tname" id="tname-'+t+'" data-team="'+t+'" value="'+esc(tm.name)+'" aria-label="Team name"><span class="bar" role="group" aria-label="Team colour">'+
      ['red','black','blue','white'].map(function(c){return '<button class="sw sm" data-team="'+t+'" data-tc="'+c+'" aria-label="'+c+'" aria-pressed="'+(tm.c===c)+'"><span style="background:'+PEN[c]+'"></span></button>'}).join('')+'</span></div>'+
      '<p class="sum">'+list.length+' players · '+(list.length-d-g)+' forwards · '+d+' defence · '+g+' goalies</p>';

function gp(pid){return state.game.p[pid]||(state.game.p[pid]={toi:0,sh:0,on:false,since:0})}
